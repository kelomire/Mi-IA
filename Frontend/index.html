<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion-IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside id="sidebar">
        <h2>🦁 Lion-IA</h2>

        <button id="newChat">+ Nueva conversación</button>

        <div id="conversationList"></div>
    </aside>

    <main>
        <header>
            <h1>Lion-IA</h1>
        </header>

        <section id="messages"></section>

        <form id="chatForm">
            <input
                id="messageInput"
                type="text"
                placeholder="Escribí tu mensaje..."
                autocomplete="off"
            >
            <button type="submit">➤</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
